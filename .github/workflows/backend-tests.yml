name: Backend Tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: balkan_events_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: services/api
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run migrations
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/balkan_events_test
          PYTHONPATH: .
        run: alembic upgrade head

      - name: Verify schema
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/balkan_events_test
        run: |
          python -c "
import asyncio
from sqlalchemy import text
from sqlalchemy.ext.asyncio import create_async_engine
import os

async def check():
    eng = create_async_engine(os.environ['DATABASE_URL'])
    async with eng.connect() as conn:
        r = await conn.execute(text(\"SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename\"))
        tables = [row[0] for row in r]
        print('Tables:', tables)
        required = ['users', 'organizations', 'events', 'ticket_types', 'ticket_inventory', 'reservations', 'ledger_entries']
        missing = [t for t in required if t not in tables]
        assert not missing, f'Missing tables: {missing}'
        print('Schema OK')
    await eng.dispose()

asyncio.run(check())
"

      - name: Run tests
        working-directory: services/api
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/balkan_events_test
          PYTHONPATH: .
          SECRET_KEY: test-secret-key-for-ci-only
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: services/api/test-results.xml
