# Super Admin Gateway. Proxies /admin to the existing API over WireGuard.
# Replace ADMIN_UPSTREAM with the WireGuard IP of the existing API host.
upstream admin_api {
    server 10.10.0.1:8000;  # WireGuard IP of existing API
}

server {
    listen 80;
    server_name admin.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.example;

    ssl_certificate /etc/letsencrypt/live/admin.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example/privkey.pem;

    # Optional: restrict to office or VPN IPs
    # allow 203.0.113.10;
    # deny all;

    location /admin/ {
        proxy_pass http://admin_api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /auth/ {
        proxy_pass http://admin_api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
