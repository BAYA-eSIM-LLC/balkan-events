# /etc/wireguard/wg0.conf to ADD on the existing server.
# Do not apply until approved. Does not change public services.
[Interface]
PrivateKey = EXISTING_PRIVATE_KEY
Address = 10.10.0.1/24
ListenPort = 51820

[Peer]
PublicKey = GATEWAY_PUBLIC_KEY
AllowedIPs = 10.10.0.2/32
Endpoint = GATEWAY_PUBLIC_IP:51820
PersistentKeepalive = 25
