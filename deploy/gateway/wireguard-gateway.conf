# /etc/wireguard/wg0.conf on the new gateway VPS
# Generate keys: wg genkey | tee privatekey | wg pubkey > publickey
[Interface]
PrivateKey = GATEWAY_PRIVATE_KEY
Address = 10.10.0.2/24
ListenPort = 51820

[Peer]
# Existing API server
PublicKey = EXISTING_SERVER_PUBLIC_KEY
AllowedIPs = 10.10.0.1/32
Endpoint = EXISTING_SERVER_PUBLIC_IP:51820
PersistentKeepalive = 25
