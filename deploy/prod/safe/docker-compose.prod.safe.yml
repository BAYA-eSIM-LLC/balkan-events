# Safe compose – uses EXISTING volume by external name.
# Replace the placeholders after discovery.
# Does NOT create a new empty volume.
# Does NOT restart postgres unless you explicitly include it.

name: balkan-events-prod   # <-- change to match existing project

services:
  # postgres service is intentionally omitted.
  # The existing container continues to run and keeps its volume.

  api:
    # Optional – only rebuild if compatibility is confirmed.
    # Leave commented until DATABASE_URL and env are verified.
    # build:
    #   context: ../../services/api
    #   dockerfile: Dockerfile.prod
    # restart: always
    # env_file: ../../.env.prod
    # networks:
    #   - existing_network

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: always
    environment:
      INTERNAL_API_URL: http://api:8000
    networks:
      - existing_network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - existing_network

networks:
  existing_network:
    external: true
    name: REPLACE_WITH_EXISTING_NETWORK   # e.g. balkan-events-prod_default

# No volumes section – we do not create or touch postgres_data
