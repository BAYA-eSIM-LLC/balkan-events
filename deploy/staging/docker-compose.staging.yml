name: balkan-events-staging
services:
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: ${STAGING_DATABASE_URL:-postgresql+asyncpg://balkan:staging@postgres:5432/balkan_events}
    depends_on:
      - postgres
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${STAGING_API_URL:-http://api:8000}
    depends_on:
      - api
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: balkan
      POSTGRES_PASSWORD: staging
      POSTGRES_DB: balkan_events
    volumes:
      - staging_pg:/var/lib/postgresql/data
volumes:
  staging_pg:
