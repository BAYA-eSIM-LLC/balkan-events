# Super Admin gateway. Not started. Replace admin.balkanevents.org after DNS approval.
upstream admin_api {
    server 10.10.0.1:8000;
}

server {
    listen 80;
    server_name admin.balkanevents.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.balkanevents.org;

    # Real certificates only. Obtain with certbot after DNS is approved.
    ssl_certificate /etc/letsencrypt/live/admin.balkanevents.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.balkanevents.org/privkey.pem;

    # IP allow-list. Leave commented until access is confirmed.
    # include /etc/nginx/admin-allowlist.conf;

    location = /health {
        proxy_pass http://admin_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        access_log off;
    }

    location /admin/ {
        proxy_pass http://admin_api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_hide_header X-Powered-By;
    }

    location /auth/ {
        proxy_pass http://admin_api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location / {
        return 404;
    }
}
